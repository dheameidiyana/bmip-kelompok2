name: bmip
networks:
  data:
    driver: bridge
    internal: true
    name: bmip_data
  edge:
    driver: bridge
    name: bmip_edge
services:
  alertmanager:
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    cpus: 0.25
    depends_on:
      notify:
        condition: service_started
        required: true
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 15s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:9093/-/healthy
      timeout: 5s
    image: prom/alertmanager:v0.27.0
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 128m
    networks:
      data: null
    ports:
      - ${BMIP_BIND_ADDRESS:-127.0.0.1}:${BMIP_ALERTMANAGER_PORT:-9093}:9093
    profiles:
      - n4
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: C:\Users\HP\Documents\KULIAH\SEMESTER 5\DESAIN APLIKASI BIG DATA\PROJECT\bmip-kelompok2\deploy\observability\alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        type: bind
      - source: alertmanager-data
        target: /alertmanager
        type: volume
        volume: {}
