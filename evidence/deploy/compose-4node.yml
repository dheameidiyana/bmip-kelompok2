      - API_PORT=8000
      - BMIP_API_KEY=${BMIP_API_KEY:?set BMIP_API_KEY in .env}
      - BMIP_API_KEY_HASH_SALT=${BMIP_API_KEY_HASH_SALT:?set BMIP_API_KEY_HASH_SALT
