name: bmip
networks:
  data:
    driver: bridge
    internal: true
    name: bmip_data
  edge:
    driver: bridge
    name: bmip_edge
services:
  api:
    build:
      context: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\api
      dockerfile: Dockerfile
    cpus: 0.5
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
          timeout=2)
      timeout: 5s
    image: bmip/api:dev
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 256m
    networks:
      data: null
      edge: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8000"
        target: 8000
    restart: unless-stopped
    user: 10001:10001
  lakekeeper:
    command:
      - serve
    cpus: 1
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__BASE_URI: http://localhost:8181
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set
        LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set
        LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?set LAKEKEEPER_PG_ENCRYPTION_KEY
        in .env}
      RUST_LOG: info
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 20s
      test:
        - CMD
        - /home/nonroot/lakekeeper
        - healthcheck
      timeout: 5s
    image: quay.io/lakekeeper/catalog@sha256:b02a882df48042020c473a79b980a643fcc883a6f9c21b74c5b7cc8eabeec9fe
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 512m
    networks:
      data: null
      edge: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8181"
        target: 8181
    restart: unless-stopped
  lakekeeper-bootstrap:
    cpus: 0.25
    depends_on:
      lakekeeper:
        condition: service_healthy
        required: true
      minio:
        condition: service_healthy
        required: true
    entrypoint:
      - python
      - /scripts/bootstrap.py
    environment:
      LAKEKEEPER_URL_INTERNAL: ${LAKEKEEPER_URL_INTERNAL:-http://lakekeeper:8181}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-lakehouse}
      MINIO_ENDPOINT_INTERNAL: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_ENDPOINT_LAKEKEEPER: ${MINIO_ENDPOINT_LAKEKEEPER:-http://host.docker.internal:9000}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_S3_REGION: ${MINIO_S3_REGION:-local}
      PYTHONDONTWRITEBYTECODE: "1"
    extra_hosts:
      - host.docker.internal:host-gateway
    image: python:3.11-alpine@sha256:bb1d70c1df30d8ee1e05214dbe82d6cdfd29833c1f47ce917f20991aca93acaa
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 128m
    networks:
      data: null
    profiles:
      - bootstrap
    restart: 'no'
    user: 1000:1000
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\lakekeeper\bootstrap.py
        target: /scripts/bootstrap.py
        type: bind
  lakekeeper-migrate:
    command:
      - migrate
    cpus: 0.5
    depends_on:
      postgres-core:
        condition: service_healthy
        required: true
    environment:
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set
        LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set
        LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?set LAKEKEEPER_PG_ENCRYPTION_KEY
        in .env}
      RUST_LOG: info
    image: quay.io/lakekeeper/catalog@sha256:b02a882df48042020c473a79b980a643fcc883a6f9c21b74c5b7cc8eabeec9fe
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 256m
    networks:
      data: null
    restart: 'no'
  minio:
    command:
      - server
      - /data
      - --console-address
      - :9001
    cpus: 1
    depends_on:
      minio-perms:
        condition: service_completed_successfully
        required: true
    environment:
      MINIO_BROWSER: 'on'
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 15s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      timeout: 5s
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 768m
    networks:
      data: null
      edge: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "9000"
        target: 9000
      - mode: ingress
        protocol: tcp
        published: "9001"
        target: 9001
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - source: minio-data
        target: /data
        type: volume
        volume: {}
  minio-init:
    cpus: 0.25
    depends_on:
      minio:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/bootstrap.sh
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SVC_API_ACCESS_KEY: ${MINIO_SVC_API_ACCESS_KEY:-svc-api}
      MINIO_SVC_API_SECRET_KEY: ${MINIO_SVC_API_SECRET_KEY:?set MINIO_SVC_API_SECRET_KEY
        in .env}
      MINIO_SVC_BACKUP_ACCESS_KEY: ${MINIO_SVC_BACKUP_ACCESS_KEY:-svc-backup}
      MINIO_SVC_BACKUP_SECRET_KEY: ${MINIO_SVC_BACKUP_SECRET_KEY:?set MINIO_SVC_BACKUP_SECRET_KEY
        in .env}
      MINIO_SVC_DBT_ACCESS_KEY: ${MINIO_SVC_DBT_ACCESS_KEY:-svc-dbt}
      MINIO_SVC_DBT_SECRET_KEY: ${MINIO_SVC_DBT_SECRET_KEY:?set MINIO_SVC_DBT_SECRET_KEY
        in .env}
      MINIO_SVC_DOCS_ACCESS_KEY: ${MINIO_SVC_DOCS_ACCESS_KEY:-svc-docs}
      MINIO_SVC_DOCS_SECRET_KEY: ${MINIO_SVC_DOCS_SECRET_KEY:?set MINIO_SVC_DOCS_SECRET_KEY
        in .env}
      MINIO_SVC_INGEST_ACCESS_KEY: ${MINIO_SVC_INGEST_ACCESS_KEY:-svc-ingest}
      MINIO_SVC_INGEST_SECRET_KEY: ${MINIO_SVC_INGEST_SECRET_KEY:?set MINIO_SVC_INGEST_SECRET_KEY
        in .env}
      MINIO_SVC_ML_ACCESS_KEY: ${MINIO_SVC_ML_ACCESS_KEY:-svc-ml}
      MINIO_SVC_ML_SECRET_KEY: ${MINIO_SVC_ML_SECRET_KEY:?set MINIO_SVC_ML_SECRET_KEY
        in .env}
      MINIO_SVC_PROCESS_ACCESS_KEY: ${MINIO_SVC_PROCESS_ACCESS_KEY:-svc-process}
      MINIO_SVC_PROCESS_SECRET_KEY: ${MINIO_SVC_PROCESS_SECRET_KEY:?set MINIO_SVC_PROCESS_SECRET_KEY
        in .env}
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 128m
    networks:
      data: null
    profiles:
      - bootstrap
    restart: 'no'
    user: 1000:1000
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\minio\bootstrap.sh
        target: /scripts/bootstrap.sh
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\minio\policies
        target: /policies
        type: bind
  minio-perms:
    cpus: 0.25
    entrypoint:
      - /bin/sh
      - -c
      - chown -R 1000:1000 /data
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 64m
    networks:
      data: null
    restart: 'no'
    user: '0:0'
    volumes:
      - source: minio-data
        target: /data
        type: volume
        volume: {}
  postgres-core:
    cpus: 1
    environment:
      LAKEKEEPER_DB_NAME: ${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD
        in .env}
      LAKEKEEPER_DB_USER: ${LAKEKEEPER_DB_USER:-lakekeeper}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 15s
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
    image: postgres:16.15-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 512m
    networks:
      data: null
      edge: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "5433"
        target: 5432
    restart: unless-stopped
    volumes:
      - source: postgres-core-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\postgres\init
        target: /docker-entrypoint-initdb.d
        type: bind
  redpanda:
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    cpus: 1.5
    healthcheck:
      interval: 15s
      retries: 20
      start_period: 45s
      test:
        - CMD-SHELL
        - rpk cluster health --exit-when-healthy
      timeout: 10s
    image: redpandadata/redpanda:v26.2.6
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 1536m
    networks:
      data: null
      edge: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "19092"
        target: 19092
      - mode: ingress
        protocol: tcp
        published: "9644"
        target: 9644
    restart: unless-stopped
    volumes:
      - source: redpanda-data
        target: /var/lib/redpanda/data
        type: volume
        volume: {}
  traefik:
    command:
      - --configFile=/etc/traefik/traefik.yml
    cpus: 0.5
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      timeout: 5s
    image: traefik:v3.7.18
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: 256m
    networks:
      edge: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8080"
        target: 8000
      - mode: ingress
        protocol: tcp
        published: "8082"
        target: 8082
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\traefik\traefik.yml
        target: /etc/traefik/traefik.yml
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: D:\SEMESTER 5\Desain Aplikasi Big Data\PROJECT\bmip-kelompok2\deploy\traefik\dynamic
        target: /etc/traefik/dynamic
        type: bind
volumes:
  minio-data:
    name: bmip_minio-data
  postgres-core-data:
    name: bmip_postgres-core-data
  redpanda-data:
    name: bmip_redpanda-data
x-healthcheck:
  interval: 10s
  retries: 12
  start_period: 30s
  timeout: 5s
x-logging:
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m
