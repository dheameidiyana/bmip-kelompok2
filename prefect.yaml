name: bmip
prefect-version: 3.9.2

build: null
push: null
pull: null

deployments:
  - name: harvest-social
    version: "1"
    description: Harvest Bluesky posts and append them to bronze.
    tags:
      - bmip
      - w1-b
      - ingestion
    entrypoint: src/bmip/flows/ingestion.py:harvest_social_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "10 * * * *"
        timezone: UTC
        active: true

  - name: transform-silver
    version: "1"
    description: Build silver and gold dbt models.
    tags:
      - bmip
      - w1-b
      - transform
    entrypoint: src/bmip/flows/ingestion.py:transform_silver_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "40 * * * *"
        timezone: UTC
        active: true

  - name: transform-gold
    version: "1"
    description: Silver quality gate, gold marts, gold gate, and Iceberg publish.
    tags:
      - bmip
      - w1-c
      - transform
      - quality
    entrypoint: src/bmip/flows/ingestion.py:transform_gold_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "50 * * * *"
        timezone: UTC
        active: true

  - name: refresh-feast
    version: "1"
    description: Materialize the latest gold features into the Feast online store.
    tags:
      - bmip
      - c3-b
      - ml
      - feast
    entrypoint: src/bmip/flows/ml.py:refresh_feast_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "55 * * * *"
        timezone: UTC
        active: true

  - name: infer-volatility
    version: "1"
    description: Score the latest feature row for every symbol and persist predictions.
    tags:
      - bmip
      - w2-a
      - ml
      - inference
    entrypoint: src/bmip/flows/ml.py:infer_volatility_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "5 * * * *"
        timezone: UTC
        active: true

  - name: train-volatility
    version: "1"
    description: Retrain E1/E2 candidates and run the champion/challenger gate.
    tags:
      - bmip
      - w2-a
      - ml
      - training
    entrypoint: src/bmip/flows/ml.py:train_volatility_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "0 2 * * 0"
        timezone: UTC
        active: true

  - name: drift-report
    version: "1"
    description: Compute PSI/KS drift, persist serving.drift_metrics, and trigger training.
    tags:
      - bmip
      - c3-b
      - ml
      - drift
    entrypoint: src/bmip/flows/ml.py:drift_report_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "30 3 * * *"
        timezone: UTC
        active: true

  - name: backfill-gold
    version: "1"
    description: Rebuild and republish gold for an explicit hour range.
    tags:
      - bmip
      - w1-c
      - backfill
    entrypoint: src/bmip/flows/ingestion.py:backfill_gold_flow
    parameters:
      start: "2026-11-10T00:00:00+00:00"
      end: "2026-11-11T00:00:00+00:00"
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1

  - name: compact_iceberg
    version: "1"
    description: Compact Iceberg files, expire 7-day snapshots, and report retention.
    tags:
      - bmip
      - c3-c
      - lifecycle
      - storage
    entrypoint: src/bmip/flows/maintenance.py:compact_iceberg_flow
    parameters:
      compact: true
      expire: true
      orphans: true
      apply_retention: []
      as_of: null
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "0 1 * * *"
        timezone: UTC
        active: true
