name: bmip
prefect-version: 3.9.2

build: null
push: null
pull: null

deployments:
  - name: harvest-social
    version: "1"
    description: Harvest Bluesky posts and append them to bronze.
    tags:
      - bmip
      - w1-b
      - ingestion
    entrypoint: src/bmip/flows/ingestion.py:harvest_social_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "10 * * * *"
        timezone: UTC
        active: true

  - name: transform-silver
    version: "1"
    description: Build silver and gold dbt models.
    tags:
      - bmip
      - w1-b
      - transform
    entrypoint: src/bmip/flows/ingestion.py:transform_silver_flow
    parameters: {}
    work_pool:
      name: local-process
      work_queue_name: default
    concurrency_limit: 1
    schedules:
      - cron: "40 * * * *"
        timezone: UTC
        active: true
