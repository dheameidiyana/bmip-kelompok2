name: ci

on:
  push:
    branches: [main, dev, "slot/**", "fix/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        timeout-minutes: 10
        run: pip install -e ".[dev,ml]"

      - name: Evidence index
        run: python scripts/w2d_evidence_check.py --check

      - name: Gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --config .gitleaks.toml --redact --no-banner --no-color
          for path in src scripts deploy docs evidence tests contracts; do
            gitleaks dir "$path" --config .gitleaks.toml --redact --no-banner --no-color
          done

      - name: Prepare compose env
        run: cp deploy/env/ci.env.example .env

      - name: Validate dev compose
        run: |
          docker compose --env-file .env \
            -f deploy/compose.base.yml -f deploy/compose.dev.yml config --quiet

      - name: Validate two-node compose
        run: |
          docker compose --env-file .env \
            -f deploy/compose.base.yml \
            -f deploy/compose.dev.yml \
            -f deploy/compose.two-node.yml \
            --profile two-node config --quiet

      - name: Ruff
        run: ruff check src scripts tests deploy

      - name: SQLFluff
        run: |
          files=$(find dbt -name '*.sql' -not -path 'dbt/target/*')
          if [ -n "$files" ]; then
            sqlfluff lint $files --dialect duckdb
          else
            echo "sqlfluff: no SQL files yet"
          fi

      - name: Pytest
        run: pytest
