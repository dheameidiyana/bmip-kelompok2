name: ci

on:
  push:
    branches: [main, dev, "slot/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        timeout-minutes: 10
        run: pip install -e ".[dev]"

      - name: Prepare compose env
        run: cp deploy/env/ci.env.example .env

      - name: Validate dev compose
        run: |
          docker compose --env-file .env \
            -f deploy/compose.base.yml -f deploy/compose.dev.yml config --quiet

      - name: Validate two-node compose
        run: |
          docker compose --env-file .env \
            -f deploy/compose.base.yml \
            -f deploy/compose.dev.yml \
            -f deploy/compose.two-node.yml \
            --profile two-node config --quiet

      - name: Ruff
        run: ruff check src scripts tests deploy

      - name: SQLFluff
        run: |
          files=$(find dbt -name '*.sql')
          if [ -n "$files" ]; then
            sqlfluff lint $files --dialect duckdb
          else
            echo "sqlfluff: no SQL files yet"
          fi

      - name: Pytest
        run: pytest
