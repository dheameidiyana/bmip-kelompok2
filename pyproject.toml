[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmip"
version = "0.1.0"
description = "Bitcoin Market Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "polars>=1.0",
    "duckdb>=1.5.3,<2",
    "dbt-duckdb>=1.9.4,<2",
    "prefect>=3,<4",
    "pyiceberg[s3fs]>=0.7",
    "pyarrow>=16",
    "tzdata>=2024",
    "confluent-kafka>=2.4",
    "websockets>=12",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4",
    "psycopg[binary]>=3.2",
    "boto3==1.43.117",
    "botocore==1.43.117",
    "python-dotenv>=1.0",
    "vaderSentiment>=3.3.2",
    "great_expectations>=1.3,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "pytest-cov>=5",
    "sqlfluff>=3",
]
dashboard = [
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bmip.serving" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies and parameter declarations are immutable call sites.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
