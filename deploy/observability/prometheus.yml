global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: bmip
    env: dev

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          layer: serving

  # The stream processor runs on the host (`make stream`), so Prometheus
  # reaches it through the Docker host gateway. The target is DOWN whenever the
  # processor is not running; BmipStreamDown says so instead of hiding it.
  - job_name: stream
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          service: stream-processor
          layer: silver

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          service: batch

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: containers
