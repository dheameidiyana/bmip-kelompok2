name: bmip

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  traefik:
    image: traefik:v3.7.18
    restart: unless-stopped
    user: "1000:1000"
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    logging: *default-logging

  postgres-core:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      LAKEKEEPER_DB_NAME: ${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER_DB_USER: ${LAKEKEEPER_DB_USER:-lakekeeper}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  postgres-ml:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PREFECT_DB_USER:-prefect}
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:?set PREFECT_DB_PASSWORD in .env}
      POSTGRES_DB: ${PREFECT_DB_NAME:-prefect}
    volumes:
      - postgres-ml-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  prefect-server:
    image: prefecthq/prefect:3.9.2-python3.12
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_SERVER_UI_ENABLED: "true"
      PREFECT_UI_API_URL: ${PREFECT_API_URL:-http://localhost:4200/api}
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_DB_USER:-prefect}:${PREFECT_DB_PASSWORD:?set PREFECT_DB_PASSWORD in .env}@postgres-ml:5432/${PREFECT_DB_NAME:-prefect}
    networks:
      - edge
      - data
    depends_on:
      postgres-ml:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *default-logging

  minio-perms:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - minio-data:/data
    networks:
      - data
    logging: *default-logging

  minio:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    restart: unless-stopped
    user: "1000:1000"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: "on"
    volumes:
      - minio-data:/data
    networks:
      - data
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

  minio-init:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    profiles: ["bootstrap"]
    restart: "no"
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_SVC_INGEST_ACCESS_KEY: ${MINIO_SVC_INGEST_ACCESS_KEY:-svc-ingest}
      MINIO_SVC_INGEST_SECRET_KEY: ${MINIO_SVC_INGEST_SECRET_KEY:?set MINIO_SVC_INGEST_SECRET_KEY in .env}
      MINIO_SVC_PROCESS_ACCESS_KEY: ${MINIO_SVC_PROCESS_ACCESS_KEY:-svc-process}
      MINIO_SVC_PROCESS_SECRET_KEY: ${MINIO_SVC_PROCESS_SECRET_KEY:?set MINIO_SVC_PROCESS_SECRET_KEY in .env}
      MINIO_SVC_DBT_ACCESS_KEY: ${MINIO_SVC_DBT_ACCESS_KEY:-svc-dbt}
      MINIO_SVC_DBT_SECRET_KEY: ${MINIO_SVC_DBT_SECRET_KEY:?set MINIO_SVC_DBT_SECRET_KEY in .env}
      MINIO_SVC_ML_ACCESS_KEY: ${MINIO_SVC_ML_ACCESS_KEY:-svc-ml}
      MINIO_SVC_ML_SECRET_KEY: ${MINIO_SVC_ML_SECRET_KEY:?set MINIO_SVC_ML_SECRET_KEY in .env}
      MINIO_SVC_API_ACCESS_KEY: ${MINIO_SVC_API_ACCESS_KEY:-svc-api}
      MINIO_SVC_API_SECRET_KEY: ${MINIO_SVC_API_SECRET_KEY:?set MINIO_SVC_API_SECRET_KEY in .env}
      MINIO_SVC_BACKUP_ACCESS_KEY: ${MINIO_SVC_BACKUP_ACCESS_KEY:-svc-backup}
      MINIO_SVC_BACKUP_SECRET_KEY: ${MINIO_SVC_BACKUP_SECRET_KEY:?set MINIO_SVC_BACKUP_SECRET_KEY in .env}
      MINIO_SVC_DOCS_ACCESS_KEY: ${MINIO_SVC_DOCS_ACCESS_KEY:-svc-docs}
      MINIO_SVC_DOCS_SECRET_KEY: ${MINIO_SVC_DOCS_SECRET_KEY:?set MINIO_SVC_DOCS_SECRET_KEY in .env}
    volumes:
      - ./minio/bootstrap.sh:/scripts/bootstrap.sh:ro
      - ./minio/policies:/policies:ro
    networks:
      - data
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog@sha256:b02a882df48042020c473a79b980a643fcc883a6f9c21b74c5b7cc8eabeec9fe
    restart: "no"
    command: ["migrate"]
    environment:
      RUST_LOG: info
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?set LAKEKEEPER_PG_ENCRYPTION_KEY in .env}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
    networks:
      - data
    depends_on:
      postgres-core:
        condition: service_healthy
    logging: *default-logging

  lakekeeper:
    image: quay.io/lakekeeper/catalog@sha256:b02a882df48042020c473a79b980a643fcc883a6f9c21b74c5b7cc8eabeec9fe
    restart: unless-stopped
    command: ["serve"]
    environment:
      RUST_LOG: info
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__BASE_URI: http://localhost:8181
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?set LAKEKEEPER_PG_ENCRYPTION_KEY in .env}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${LAKEKEEPER_DB_USER:-lakekeeper}:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}@postgres-core:5432/${LAKEKEEPER_DB_NAME:-lakekeeper}
    networks:
      - data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  lakekeeper-bootstrap:
    image: python:3.11-alpine@sha256:bb1d70c1df30d8ee1e05214dbe82d6cdfd29833c1f47ce917f20991aca93acaa
    profiles: ["bootstrap"]
    restart: "no"
    user: "1000:1000"
    entrypoint: ["python", "/scripts/bootstrap.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ENDPOINT_INTERNAL: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_ENDPOINT_LAKEKEEPER: ${MINIO_ENDPOINT_LAKEKEEPER:-http://host.docker.internal:9000}
      MINIO_S3_REGION: ${MINIO_S3_REGION:-local}
      LAKEKEEPER_URL_INTERNAL: ${LAKEKEEPER_URL_INTERNAL:-http://lakekeeper:8181}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-lakehouse}
    volumes:
      - ./lakekeeper/bootstrap.py:/scripts/bootstrap.py:ro
    networks:
      - data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    image: bmip/api:dev
    restart: unless-stopped
    user: "10001:10001"
    environment:
      BMIP_ENV: ${BMIP_ENV:-dev}
      BMIP_NODE: ${BMIP_NODE:-n1}
      BMIP_LOG_LEVEL: ${BMIP_LOG_LEVEL:-INFO}
      BMIP_COMMIT: ${BMIP_COMMIT:-local}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-true}
      BMIP_API_KEY: ${BMIP_API_KEY:?set BMIP_API_KEY in .env}
      MARKET_SYMBOL: ${MARKET_SYMBOL:-BTCUSDT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_S3_REGION: ${MINIO_S3_REGION:-local}
      LAKEKEEPER_URL: ${LAKEKEEPER_URL_INTERNAL:-http://lakekeeper:8181}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-lakehouse}
      POSTGRES_CORE_DSN: postgresql://${POSTGRES_USER:-bmip}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres-core:5432/${POSTGRES_DB:-bmip}
      MINIO_SVC_API_ACCESS_KEY: ${MINIO_SVC_API_ACCESS_KEY:-svc-api}
      MINIO_SVC_API_SECRET_KEY: ${MINIO_SVC_API_SECRET_KEY:?set MINIO_SVC_API_SECRET_KEY in .env}
      FRESHNESS_MARKET_SLO_SECONDS: ${FRESHNESS_MARKET_SLO_SECONDS:-5400}
      FRESHNESS_SENTIMENT_SLO_SECONDS: ${FRESHNESS_SENTIMENT_SLO_SECONDS:-5400}
      FRESHNESS_PREDICTIONS_SLO_SECONDS: ${FRESHNESS_PREDICTIONS_SLO_SECONDS:-7200}
      BMIP_AS_OF: ${BMIP_AS_OF:-}
    networks:
      - edge
      - data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-core:
        condition: service_healthy
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    logging: *default-logging

  dashboard:
    build:
      context: ..
      dockerfile: deploy/dashboard/Dockerfile
    image: bmip/dashboard:dev
    restart: unless-stopped
    user: "10001:10001"
    environment:
      BMIP_ENV: ${BMIP_ENV:-dev}
      BMIP_LOG_LEVEL: ${BMIP_LOG_LEVEL:-INFO}
      BMIP_API_BASE_URL: http://api:8000
      BMIP_API_KEY: ${BMIP_API_KEY:?set BMIP_API_KEY in .env}
      BMIP_DASHBOARD_SYMBOL: ${MARKET_SYMBOL:-BTCUSDT}
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging


networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  redpanda-data:
  postgres-core-data:
  postgres-ml-data:
  minio-data:
