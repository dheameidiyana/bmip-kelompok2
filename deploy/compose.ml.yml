services:
  mlflow-db-init:
    image: postgres:16.15-alpine
    environment:
      PGPASSWORD: ${PREFECT_DB_PASSWORD:?set PREFECT_DB_PASSWORD in .env}
      PGUSER: ${PREFECT_DB_USER:-prefect}
      PGDATABASE: postgres
    command:
      - /bin/sh
      - -c
      - |
        until pg_isready -h postgres-ml -U "$$PGUSER" -d postgres; do sleep 1; done
        psql -h postgres-ml -U "$$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='mlflow'" \
          | grep -q 1 \
          || psql -h postgres-ml -U "$$PGUSER" -d postgres -c "CREATE DATABASE mlflow OWNER $$PGUSER"
    depends_on:
      postgres-ml:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: bmip/mlflow:dev
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "postgresql://${PREFECT_DB_USER:-prefect}:${PREFECT_DB_PASSWORD}@postgres-ml:5432/mlflow" \
          --serve-artifacts \
          --artifacts-destination "s3://artifacts/mlflow" \
          --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000,mlflow,localhost"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SVC_ML_ACCESS_KEY:-svc-ml}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SVC_ML_SECRET_KEY:?set MINIO_SVC_ML_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${MINIO_S3_REGION:-local}
    ports:
      - "5000:5000"
    networks:
      - data
      - edge
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
      postgres-ml:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      ML_FEATURE_CACHE: /app/data/ml/latest_features.json
    volumes:
      - ../data/ml:/app/data/ml:ro
    depends_on:
      mlflow:
        condition: service_healthy
