server {
    listen 8089;
    server_name docs.bmip.local;

    root /usr/share/nginx/html;
    index index.html;

    # The CI checks and the demo both use plain paths, no SPA rewriting.
    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    location /gx/ {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    location /dbt/ {
        try_files $uri $uri/ =404;
        autoindex on;
    }
}
