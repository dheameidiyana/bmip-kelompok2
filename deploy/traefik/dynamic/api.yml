tls:
  certificates:
    - certFile: /etc/traefik/certs/bmip.pem
      keyFile: /etc/traefik/certs/bmip-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/bmip.pem
        keyFile: /etc/traefik/certs/bmip-key.pem

http:
  routers:
    api-read-host:
      rule: "Host(`api.bmip.local`) && !PathPrefix(`/v1/predict`) && !PathPrefix(`/v1/admin`)"
      entryPoints: [websecure]
      tls: {}
      service: api
      middlewares: [api-rate-limit, api-retry, api-circuit, api-headers]
      priority: 30

    api-write-host:
      rule: "Host(`api.bmip.local`) && (PathPrefix(`/v1/predict`) || PathPrefix(`/v1/admin`))"
      entryPoints: [websecure]
      tls: {}
      service: api-primary
      middlewares: [api-rate-limit, api-headers]
      priority: 40

    api-dev:
      rule: "PathPrefix(`/api`) || PathPrefix(`/v1`) || PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`)"
      entryPoints: [dev]
      service: api
      middlewares: [api-rate-limit, api-retry, api-circuit, api-headers]
      priority: 20

    api-write-dev:
      rule: "PathPrefix(`/v1/predict`) || PathPrefix(`/v1/admin`)"
      entryPoints: [dev]
      service: api-primary
      middlewares: [api-rate-limit, api-headers]
      priority: 30

    api-chaos:
      rule: "PathPrefix(`/`)"
      entryPoints: [chaos]
      service: api-chaos
      middlewares: [api-circuit, api-headers]
      priority: 10

    api-rate-test:
      rule: "PathPrefix(`/`)"
      entryPoints: [ratetest]
      service: api
      middlewares: [api-rate-limit]
      priority: 10

    app-host:
      rule: "Host(`app.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: dashboard
      middlewares: [ui-headers]
      priority: 20

    catalog-host:
      rule: "Host(`catalog.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: catalog
      middlewares: [ui-headers]
      priority: 20

    grafana-host:
      rule: "Host(`grafana.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: grafana
      middlewares: [ui-headers]
      priority: 20

    prometheus-host:
      rule: "Host(`prometheus.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: prometheus
      middlewares: [admin-auth, ui-headers]
      priority: 20

    marquez-host:
      rule: "Host(`marquez.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: marquez
      middlewares: [admin-auth, ui-headers]
      priority: 20

    minio-host:
      rule: "Host(`minio.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: minio
      middlewares: [admin-auth, ui-headers]
      priority: 20

    prefect-host:
      rule: "Host(`prefect.bmip.local`)"
      entryPoints: [websecure]
      tls: {}
      service: prefect
      middlewares: [ui-headers]
      priority: 20

  services:
    dashboard:
      loadBalancer:
        healthCheck:
          path: /_stcore/health
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://dashboard:8501"

    catalog:
      loadBalancer:
        healthCheck:
          path: /_stcore/health
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://catalog:8502"

    grafana:
      loadBalancer:
        healthCheck:
          path: /api/health
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://grafana:3000"

    prometheus:
      loadBalancer:
        healthCheck:
          path: /-/healthy
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://prometheus:9090"

    marquez:
      loadBalancer:
        servers:
          - url: "http://marquez-web:3000"

    minio:
      loadBalancer:
        healthCheck:
          path: /minio/health/live
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://minio:9001"

    prefect:
      loadBalancer:
        healthCheck:
          path: /api/health
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://prefect-server:4200"

  middlewares:
    api-rate-limit:
      rateLimit:
        average: 100
        burst: 200

    api-retry:
      retry:
        attempts: 3
        initialInterval: 200ms

    api-circuit:
      circuitBreaker:
        expression: "ResponseCodeRatio(500, 600, 0, 600) > 0.25 || LatencyAtQuantileMS(50.0) > 1500"
        checkPeriod: 10s
        fallbackDuration: 10s
        recoveryDuration: 10s

    api-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    ui-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/users.htpasswd
