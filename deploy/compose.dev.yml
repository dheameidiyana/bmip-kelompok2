services:
  traefik:
    ports:
      - "8080:8000"
      - "8082:8082"
    mem_limit: 256m
    cpus: 0.50

  redpanda:
    ports:
      - "19092:19092"
      - "9644:9644"
    networks:
      - edge
      - data
    mem_limit: 1536m
    cpus: 1.50

  postgres-core:
    ports:
      - "5433:5432"
    networks:
      - edge
      - data
    mem_limit: 512m
    cpus: 1.00

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - edge
      - data
    mem_limit: 768m
    cpus: 1.00

  postgres-ml:
    ports:
      - "5434:5432"
    networks:
      - edge
      - data
    mem_limit: 512m
    cpus: 1.00

  prefect-server:
    ports:
      - "4200:4200"
    mem_limit: 1024m
    cpus: 1.50

  minio-perms:
    mem_limit: 64m
    cpus: 0.25

  minio-init:
    mem_limit: 128m
    cpus: 0.25

  lakekeeper-migrate:
    mem_limit: 256m
    cpus: 0.50

  lakekeeper:
    ports:
      - "8181:8181"
    networks:
      - edge
      - data
    mem_limit: 512m
    cpus: 1.00

  lakekeeper-bootstrap:
    mem_limit: 128m
    cpus: 0.25

  api:
    ports:
      - "8000:8000"
    mem_limit: 768m
    cpus: 1.00

  dashboard:
    ports:
      - "8501:8501"
    mem_limit: 384m
    cpus: 0.50
