services:
  traefik:
    ports:
      - "${BMIP_EDGE_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${BMIP_EDGE_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:8080:8000"
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:8084:8084"
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:8085:8085"
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:8082:8082"
    mem_limit: 256m
    cpus: 0.50

  redpanda:
    ports:
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:19092:19092"
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:9644:9644"
    networks:
      - edge
      - data
    mem_limit: 1536m
    cpus: 1.50

  postgres-core:
    ports:
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    networks:
      - edge
      - data
    mem_limit: 512m
    cpus: 1.00

  postgres-gov:
    ports:
      - "${BMIP_BIND_ADDRESS:-127.0.0.1}:5435:5432"
    mem_limit: 256m
    cpus: 0.50

  minio:
